# ============================================================
# Pipeline CI/CD para Sistema de Gestión de Restaurante Inteligente
# Azure DevOps → Azure App Service (Next.js 14 + Node.js 20)
# ============================================================

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/**

pr:
  branches:
    include:
      - main

variables:
  nodeVersion: '20.x'
  azureServiceConnection: 'azure-connection'       # ← cambiar por tu nombre de Service Connection
  webAppName: 'restaurant-system-app'              # ← cambiar por el nombre de tu Web App
  environmentGroupName: 'production'               # entorno con aprobación manual en Azure DevOps

stages:
  # ============================================================
  # ETAPA 1: BUILD (Integración Continua)
  # ============================================================
  - stage: Build
    displayName: 'Compilar proyecto'
    jobs:
      - job: BuildJob
        displayName: 'Build Next.js'
        pool:
          vmImage: 'ubuntu-22.04'

        steps:
          - checkout: self
            displayName: 'Descargar código fuente'

          - task: NodeTool@0
            displayName: 'Instalar Node.js $(nodeVersion)'
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            displayName: 'Instalar dependencias (npm ci)'

          - script: npm run lint
            displayName: 'Ejecutar linter (ESLint)'

          - script: npm run build
            displayName: 'Compilar para producción (next build)'
            env:
              DATABASE_URL: 'postgresql://placeholder'
              JWT_SECRET: 'build-placeholder-secret'

          - script: npm prune --omit=dev --no-audit --no-fund
            displayName: 'Eliminar dependencias de desarrollo (npm prune)'

          - script: |
              set -e
              STAGE="$(Build.ArtifactStagingDirectory)/app"
              mkdir -p "$STAGE"

              rsync -a --exclude '/cache' .next "$STAGE/"
              rsync -a node_modules "$STAGE/"

              if [ -d public ]; then rsync -a public "$STAGE/"; fi

              cp package.json package-lock.json next.config.js tsconfig.json "$STAGE/"

              if [ -d "$STAGE/.next/cache" ]; then
                rm -rf "$STAGE/.next/cache"
              fi

              cd "$STAGE"
              zip -qr ../app.zip .
              cd -

              echo "Contenido y tamaño del paquete zip:"
              ls -lh "$(Build.ArtifactStagingDirectory)"
            displayName: 'Preparar ZIP para App Service'

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar artefacto de build'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/app.zip'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  # ============================================================
  # ETAPA 2: DEPLOY a PRODUCTION (con aprobación manual)
  # ============================================================
  - stage: Deploy_Production
    displayName: 'Deploy a Producción'
    dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: DeployProduction
        displayName: 'Desplegar en App Service'
        environment: $(environmentGroupName)
        pool:
          vmImage: 'ubuntu-22.04'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'drop'

                - task: AzureWebApp@1
                  displayName: 'Deploy a App Service (Windows)'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: 'webApp'
                    appName: $(webAppName)
                    package: '$(Pipeline.Workspace)/drop/app.zip'
                    runtimeStack: 'NODE|20-lts'
                    startupCommand: 'npx next start -H 0.0.0.0 -p %PORT%'

                - script: |
                    echo "Esperando a que la app arranque..."
                    for i in {1..30}; do
                      STATUS=$(curl -sS -o /tmp/app_health.out -w "%{http_code}" "https://$(webAppName).azurewebsites.net/menu" || true)
                      echo "Intento $i => $STATUS"
                      if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ] || [ "$STATUS" = "307" ]; then
                        echo "Deploy OK"
                        exit 0
                      fi
                      sleep 10
                    done

                    echo "##vso[task.logissue type=error]La app no responde correctamente (status: $STATUS)"
                    echo "Contenido de la respuesta:"
                    cat /tmp/app_health.out || true
                    exit 1
                  displayName: 'Verificar health check'
