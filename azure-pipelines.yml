# ============================================================
# Pipeline CI/CD para Sistema de Gestión de Restaurante Inteligente
# Azure DevOps → Azure App Service (Next.js 14 + Node.js 20)
# ============================================================

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/**

pr:
  branches:
    include:
      - main

variables:
  nodeVersion: '20.x'
  azureServiceConnection: 'azure-connection'       # ← cambiar por tu nombre de Service Connection
  webAppName: 'restaurant-system-app'              # ← cambiar por el nombre de tu Web App
  environmentGroupName: 'production'               # ← entorno con aprobación manual en Azure DevOps

stages:
  # ============================================================
  # ETAPA 1: BUILD (Integración Continua)
  # ============================================================
  - stage: Build
    displayName: 'Compilar proyecto'
    jobs:
      - job: BuildJob
        displayName: 'Build Next.js'
        pool:
          vmImage: 'ubuntu-latest'

        steps:
          - checkout: self
            displayName: 'Descargar código fuente'

          - task: NodeTool@0
            displayName: 'Instalar Node.js $(nodeVersion)'
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            displayName: 'Cache de dependencias npm'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.npm-cache

          - script: npm ci
            displayName: 'Instalar dependencias (npm ci)'
            env:
              npm_config_cache: $(Pipeline.Workspace)/.npm-cache

          - script: npm run lint
            displayName: 'Ejecutar linter (ESLint)'

          - script: npm run build
            displayName: 'Compilar para producción (next build)'
            env:
              # Variables mínimas para que el build no falle.
              # En runtime se inyectan desde Azure App Service.
              DATABASE_URL: 'postgresql://placeholder'
              JWT_SECRET: 'build-placeholder-secret'

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar artefacto de build'
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  # ============================================================
  # ETAPA 2: DEPLOY a PRODUCTION (con aprobación manual)
  # ============================================================
  - stage: Deploy_Production
    displayName: 'Deploy a Producción'
    dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: DeployProduction
        displayName: 'Desplegar en App Service'
        environment: $(environmentGroupName)   # ← aprobación manual configurada aquí
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'drop'

                - task: AzureWebApp@1
                  displayName: 'Deploy a App Service'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: 'webAppLinux'
                    appName: $(webAppName)
                    package: '$(Pipeline.Workspace)/drop'
                    runtimeStack: 'NODE|20-lts'
                    startupCommand: 'npm run start'

                - script: |
                    echo "Esperando a que la app arranque..."
                    sleep 20
                    RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://$(webAppName).azurewebsites.net/menu)
                    echo "Status code: $RESPONSE"
                    if [ "$RESPONSE" != "200" ]; then
                      echo "##vso[task.logissue type=error]La app no responde correctamente (status: $RESPONSE)"
                      exit 1
                    fi
                    echo "Deploy OK"
                  displayName: 'Verificar health check'
